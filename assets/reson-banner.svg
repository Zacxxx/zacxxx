<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" role="img" aria-labelledby="title desc">
  <title id="title">RESON banner</title>
  <desc id="desc">Dark audio wave banner with orange resonant rings and the text RESON, emotionally steerable generative audio.</desc>
  <defs>
    <radialGradient id="bg" cx="26%" cy="53%" r="70%">
      <stop offset="0%" stop-color="#271006"/>
      <stop offset="38%" stop-color="#0b0503"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="18%" stop-color="#ffb13b"/>
      <stop offset="52%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#130603"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7800"/>
      <stop offset="45%" stop-color="#ffd07a"/>
      <stop offset="100%" stop-color="#ff6400"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity=".2"/>
      <stop offset="18%" stop-color="#ff9a15" stop-opacity="1"/>
      <stop offset="42%" stop-color="#ffd27c" stop-opacity=".95"/>
      <stop offset="64%" stop-color="#ff7410" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .48 0 0 .28  0 0 .08 0 0  0 0 0 1 0" result="orange"/>
      <feMerge>
        <feMergeNode in="orange"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 9h10" stroke="#ff6a00" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#scan)" opacity=".3"/>

  <g opacity=".25" fill="none" stroke="#ff6a00">
    <circle cx="423" cy="520" r="390" stroke-opacity=".14"/>
    <circle cx="423" cy="520" r="340" stroke-opacity=".18"/>
    <circle cx="423" cy="520" r="300" stroke-opacity=".24"/>
    <circle cx="423" cy="520" r="250" stroke-opacity=".3"/>
    <circle cx="423" cy="520" r="205" stroke-opacity=".2"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <circle cx="423" cy="520" r="242" stroke-width="18"/>
    <circle cx="423" cy="520" r="205" stroke-width="8"/>
    <circle cx="423" cy="520" r="154" stroke-width="8"/>
    <circle cx="423" cy="520" r="104" stroke-width="6"/>
    <path d="M244 506c4-126 88-217 183-214 78 2 141 62 160 145 26 116-42 237-163 237-102 0-184-75-180-168z" stroke-width="20" opacity=".95"/>
  </g>

  <circle cx="423" cy="520" r="21" fill="url(#core)" filter="url(#softGlow)"/>

  <g opacity=".62" stroke="#ff7a00" stroke-width="2" stroke-linecap="round">
    <path d="M-15 756c126-23 202 32 326 22 132-11 195-92 327-80 120 11 152 91 260 88 118-3 151-98 269-104 119-7 168 85 281 79 83-4 118-57 208-53 52 2 96 23 141 55" fill="none" stroke="url(#wave)" filter="url(#glow)"/>
    <path d="M-14 778c153-12 217 44 350 34 132-10 189-77 313-66 119 11 161 79 269 80 114 1 159-66 267-78 118-14 190 45 281 44 98-1 144-63 271-21" fill="none" stroke="#ff7a00" stroke-opacity=".25"/>
    <path d="M-14 731c119 12 195 62 314 53 139-10 205-115 345-104 125 10 160 96 269 101 118 5 159-83 276-91 123-9 179 70 287 74 80 3 127-31 254-2" fill="none" stroke="#ffd18a" stroke-opacity=".32"/>
  </g>

  <g opacity=".45" fill="#ff6a00">
    <circle cx="138" cy="325" r="2"/>
    <circle cx="456" cy="179" r="3"/>
    <circle cx="528" cy="202" r="2"/>
    <circle cx="589" cy="239" r="2"/>
    <circle cx="196" cy="693" r="2"/>
    <circle cx="302" cy="834" r="2"/>
    <circle cx="714" cy="860" r="2"/>
    <circle cx="822" cy="884" r="2"/>
    <circle cx="890" cy="680" r="2"/>
    <circle cx="1020" cy="727" r="2"/>
  </g>

  <g opacity=".55" fill="#ff7900">
    <rect x="743" y="518" width="3" height="84"/>
    <rect x="760" y="572" width="3" height="41"/>
    <rect x="777" y="493" width="3" height="113"/>
    <rect x="794" y="542" width="3" height="87"/>
    <rect x="811" y="603" width="3" height="48"/>
    <rect x="828" y="557" width="3" height="96"/>
    <rect x="845" y="531" width="3" height="136"/>
    <rect x="862" y="584" width="3" height="86"/>
    <rect x="879" y="607" width="3" height="49"/>
  </g>

  <g font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" text-rendering="geometricPrecision">
    <text x="934" y="517" fill="#ff7a12" font-size="156" font-weight="300" letter-spacing="54" filter="url(#softGlow)">RESON</text>
    <text x="939" y="588" fill="#f6dfbc" font-size="38" font-weight="300" letter-spacing="4">emotionally steerable generative audio</text>
  </g>
</svg>
